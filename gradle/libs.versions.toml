[versions]
agp = "8.13.2"
android-build-compileSdk = "36"
android-build-minSdk = "24"
android-build-targetSdk = "36"
android-material = "1.13.0"
androidx-activity = "1.12.2"
androidx-fragment = "1.8.9"
androidx-lifecycle = "2.10.0"
androidx-navigation = "2.9.6"
androidx-paging = "3.3.6"
androidx-swiperefreshlayout = "1.2.0"
androidx-test-core = "1.7.0"
androidx-test-espresso = "3.7.0"
androidx-test-orchestrator = "1.6.1"
androidx-test-truth = "1.7.0"
jvm = "21"
coil = "2.7.0"
dagger = "2.57.2"
detekt = "1.23.8"
hamcrest = "3.0"
javapoet = "1.13.0"
ksp = "2.2.20-2.0.4"
kotlin = "2.2.20"
kotlinx-coroutines = "1.10.2"
ktlint = "0.50.0"
ktlint-gradle = "14.0.1"
mockk = "1.14.7"
moshi = "1.15.2"
okhttp-logging-interceptor = "5.3.2"
retrofit = "3.0.0"
room = "2.8.4"
timber = "5.0.1"
